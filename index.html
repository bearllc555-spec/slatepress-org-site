<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlatePress — slatepress.org</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/favicon.svg"/>
<meta name="description" content="You've reached slatepress.org. The main site is at slatepress.co.">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="10; url=https://slatepress.co/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:#FAFBFF;
    color:#0A0A0A;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    line-height:1.5;
  }
  .wrap{max-width:560px;width:100%;text-align:center}
  .brand{
    display:inline-flex;align-items:center;
    font-weight:900;font-size:32px;letter-spacing:-.02em;
    color:#0A0A0A;line-height:1;
    margin-bottom:36px;
  }
  .brand .slash{color:#2563EB;font-weight:900;margin:0 .04em}
  .eyebrow{
    display:inline-block;
    font-size:11.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    color:#2563EB;
    background:#EFF3FF;
    padding:.4rem .85rem;
    border-radius:999px;
    margin-bottom:20px;
  }
  h1{
    font-size:clamp(28px,5.5vw,44px);
    font-weight:800;letter-spacing:-.025em;
    line-height:1.1;color:#0A0A0A;
    margin-bottom:18px;
  }
  h1 em{font-style:normal;color:#2563EB}
  p.lead{
    font-size:16.5px;color:#3A3D42;
    max-width:46ch;margin:0 auto 32px;line-height:1.6;
  }
  .cta{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.95rem 1.7rem;
    background:#2563EB;color:#fff;
    font-weight:700;font-size:15px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(37,99,235,.18);
    transition:background .2s,transform .2s;
  }
  .cta:hover{background:#1D4ED8;transform:translateY(-1px)}
  .cta svg{width:14px;height:14px}
  .countdown{
    margin-top:28px;
    font-size:13px;color:#6B6A73;
  }
  .countdown strong{color:#0A0A0A;font-weight:600}
  .footer{
    margin-top:56px;
    font-size:12.5px;color:#6B6A73;
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span>SLATE</span><span class="slash">\</span><span>PRESS</span></div>
  <span class="eyebrow">slatepress.org</span>
  <h1>You've reached our <em>defensive</em> property.</h1>
  <p class="lead">This is a sister property of SlatePress. The main site lives at <strong style="color:#0A0A0A">slatepress.co</strong> — sending you there now.</p>
  <a href="https://slatepress.co/" class="cta">
    Visit slatepress.co
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </a>
  <p class="countdown">Auto-redirecting in <strong id="t">10</strong> seconds…</p>
  <div class="footer">Another SlatePress property · 2026</div>
</main>
<script>
  var n=10,el=document.getElementById('t');
  var i=setInterval(function(){n--;el.textContent=n;if(n<=0){clearInterval(i);}},1000);
</script>
</body>
</html>
